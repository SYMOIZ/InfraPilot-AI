name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, test, package backend
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Ruff lint
        run: ruff check backend agent rules

      - name: Pytest
        env:
          DEMO_MODE: "true"
        run: pytest -q

      - name: Build Lambda-style package (smoke)
        run: |
          mkdir -p dist/lambda
          pip install -r backend/requirements.txt -t dist/lambda
          cp -R backend/app agent rules catalog dist/lambda/
          (cd dist/lambda && zip -qr ../infrapilot-api-ci.zip .)
          ls -lh dist/infrapilot-api-ci.zip

      - name: Upload Lambda zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: infrapilot-api
          path: dist/infrapilot-api-ci.zip
          retention-days: 7

  frontend:
    name: Build frontend (if present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend
        id: fe
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "frontend/ not present — skipping Vite build (PLANNED)"
          fi

      - name: Set up Node
        if: steps.fe.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        if: steps.fe.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload dist
        if: steps.fe.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
